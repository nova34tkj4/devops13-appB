name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Langkah 1: Download kode dari repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Langkah 2: Setup Docker Buildx (fitur build Docker modern & cepat)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Langkah 3: Login ke Docker Hub menggunakan GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Langkah 4: Build image dan Push ke Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Mengatur tag otomatis: versi 'latest' dan versi berdasarkan SHA commit GitHub
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/github-action-app:latest
            ${{ secrets.DOCKER_USERNAME }}/github-action-app:${{ github.sha }}

  deploy:
    # Menunggu job build-and-push selesai terlebih dahulu
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      # Langkah untuk masuk ke server via SSH dan mengeksekusi perintah deploy
      - name: Execute Remote SSH Commands to Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 1. Login ke Docker Hub di dalam server (jika repositori Anda private)
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # 2. Tarik (pull) image terbaru yang baru saja di-push
            docker pull ${{ secrets.DOCKER_USERNAME }}/github-action-app:latest
            
            # 3. Hentikan dan hapus container lama jika sedang berjalan
            docker stop nama-container-app || true
            docker rm nama-container-app || true
            
            # 4. Jalankan container baru dengan image yang baru di-pull
            docker run -d \
              --name nama-container-app \
              -p 3000:3000 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/github-action-app:latest
