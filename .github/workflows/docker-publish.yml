name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  # Job baru khusus untuk mendeteksi workflow dimulai
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - name: Discord Notification - Start
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: \${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: "🚀 **Workflow Dimulai!** Proses Build, Push, dan Deploy untuk aplikasi `github-action-app` sedang berjalan..."

  build-and-push:
    needs: notify-start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: \${{ secrets.DOCKER_USERNAME }}
          password: \${{ secrets.DOCKER_PASSWORD }}

      # Menggunakan Commit SHA sebagai tag untuk build
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            \${{ secrets.DOCKER_USERNAME }}/github-action-app:latest
            \({{ secrets.DOCKER_USERNAME }}/github-action-app:\){{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands to Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: \${{ secrets.SERVER_HOST }}
          username: \${{ secrets.SERVER_USER }}
          key: \${{ secrets.SERVER_SSH_KEY }}
          port: \${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "\${{ secrets.DOCKER_PASSWORD }}" | docker login -u "\${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker pull \${{ secrets.DOCKER_USERNAME }}/github-action-app:latest
            docker stop nama-container-app || true
            docker rm nama-container-app || true
            docker run -d \
              --name nama-container-app \
              -p 3000:3000 \
              --restart always \
              \${{ secrets.DOCKER_USERNAME }}/github-action-app:latest

  # Job penutup untuk melaporkan hasil akhir (Sukses / Gagal)
  notify-status:
    # Selalu jalankan job ini meskipun ada job sebelumnya yang gagal atau di-cancel
    if: always()
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    steps:
      # Dikirim jika seluruh langkah sukses
      - name: Discord Notification - Success
        if: \${{ needs.build-and-push.result == 'success' && needs.deploy.result == 'success' }}
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: \${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: "✅ **Workflow Sukses!** Aplikasi `github-action-app` berhasil di-build, di-push, dan dideploy ke server."

      # Dikirim jika ada salah satu job yang gagal
      - name: Discord Notification - Failure
        if: \${{ needs.build-and-push.result == 'failure' || needs.deploy.result == 'failure' }}
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: \${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: "❌ **Workflow Gagal!** Terjadi error saat melakukan build atau deployment aplikasi `github-action-app`. Silakan periksa log GitHub Actions Anda."
