name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Langkah 1: Download kode dari repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug koneksi
        run: |
          getent hosts multica.bythen.ai || nslookup multica.bythen.ai
          curl -v --connect-timeout 10 https://multica.bythen.ai -o /dev/null || true
